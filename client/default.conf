server {
    listen 80;
    server_name localhost;  # Replace with your domain or IP if necessary

    location /api/ {
        proxy_pass http://backend-service:3000;  # Assuming the backend service is running on this port in Kubernetes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;  # Serve index.html for all routes
    }
}
